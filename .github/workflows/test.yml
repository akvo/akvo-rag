name: Test Services

on:
  push:
    branches:
      - main
      - "phase-**"
      - "epic/**"
  pull_request:
    branches:
      - main
      - "phase-**"
      - "epic/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create env file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to become healthy..."
          sleep 25
          docker compose ps

      - name: Seed database prompts
        run: docker compose exec -T backend python -m app.seeder.seed_prompts

      - name: Check service health
        run: |
          # Test Frontend
          curl -f http://localhost:3000/
          # Test Backend API Health
          curl -f http://localhost:8000/api/health

      - name: Run backend tests
        run: ./backend/test.sh

      - name: Run vector-kb-mcp tests
        run: docker exec akvo-rag-vector-kb-mcp-1 pytest tests/ -v

      - name: Show logs if failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
